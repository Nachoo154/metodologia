{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Metodología</title>
    <link rel="stylesheet" href="{% static 'css/admin_product_form.css' %}">
</head>
<body>
    <header>
        <h1>{{ title }}</h1>
        <a href="/admin/">← Volver</a>
    </header>

    <div class="container">
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="current_image" value="{{ product.image|default:'' }}">

            <div class="form-group">
                <label for="name">Nombre del Producto</label>
                <input type="text" id="name" name="name" value="{{ product.name|default:'' }}" placeholder="Ej: Laptop" required>
            </div>

            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" name="description" placeholder="Describe el producto..." required>{{ product.description|default:'' }}</textarea>
            </div>

            <div class="form-group">
                <label for="price">Precio</label>
                <input type="number" id="price" name="price" value="{{ product.price|default:'' }}" placeholder="0.00" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" id="stock" name="stock" value="{{ product.stock|default:'0' }}" placeholder="Cantidad disponible" min="0" required>
            </div>

            <div class="form-group">
                <label for="image_url">URL de imagen</label>
                <input type="url" id="image_url" name="image_url" value="" placeholder="https://...">
            </div>

            <div class="button-group">
                <button type="submit">{{ button_text }}</button>
                <a href="/admin/" class="btn btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
